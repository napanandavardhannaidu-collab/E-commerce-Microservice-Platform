server:
  port: 8080

spring:
  application:
    name: api-gateway

services:
  user:
    url: ${USER_SERVICE_URL:http://user-service:8083}
  product:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8081}
  order:
    url: ${ORDER_SERVICE_URL:http://order-service:8082}
  cart:
    url: ${CART_SERVICE_URL:http://cart-service:8084}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://payment-service:8085}
  shipping:
    url: ${SHIPPING_SERVICE_URL:http://shipping-service:8086}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8087}
  review:
    url: ${REVIEW_SERVICE_URL:http://review-service:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    com.shopsphere.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
